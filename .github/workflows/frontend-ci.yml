name: CI Frontend

# Se activa cuando se abre un PR hacia las ramas de integración
on:
  pull_request:
    branches:
      - development
      - master

jobs:
  frontend-build-and-test:
    name: Frontend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/dashboard/package-lock.json

      - name: Instalar dependencias 
        run: npm install
        working-directory: frontend/dashboard

      - name: 1. Ejecutar Build 
        run: npm run build
        working-directory: frontend/dashboard

      - name: 2. Ejecutar Tests Unitarios 
        run: npm test
        working-directory: frontend/dashboard